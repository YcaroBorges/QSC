<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITE DA BRENDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
        }
        h1 {
            color: #d6336c;
            font-family: 'Playfair Display', serif;
            font-size: 5vw;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .image-box {
            margin: 20px 0;
            padding: 10px;
            border: 2px solid #f7c6d4;
            border-radius: 10px;
            background-color: #fff6f8;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .image-box img {
            max-width: 100%;
            border-radius: 8px;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .button {
            background-color: #ff6f91;
            border: 2px solid #ff4b5c;
            color: #fff;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .button:hover {
            background-color: #ff4b5c;
            transform: scale(1.1);
            box-shadow: 0px 8px 15px rgba(255, 75, 92, 0.5);
        }
        #message {
            display: none;
            margin-top: 20px;
            font-size: 1.5rem;
            color: #28a745;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
        }
        #tiktok-button, #whatsapp-button, #friend-help-button, #persistence-button {
            display: none;
            margin-top: 20px;
        }
        .extra-option {
            margin-top: 20px;
        }
        #toggle-whatsapp {
            background-color: transparent;
            border: none;
            font-size: 1.2rem;
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Media queries para smartphones */
        @media (max-width: 600px) {
            h1 {
                font-size: 7vw;
            }
            .button {
                font-size: 4vw;
                padding: 10px 15px;
            }
            #message {
                font-size: 5vw;
            }
            .buttons {
                flex-direction: column;
                gap: 10px;
            }
            #nao {
                position: static !important;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Você já pensou em voltar atrás?</h1>

    <div class="image-box">
        <img src="brenda.png" alt="Descrição da Imagem">
    </div>

    <div class="buttons">
        <button class="button" id="sim">Sim</button>
        <button class="button" id="nao">Não</button>
    </div>

    <div id="message">Então o que você está esperando!?</div>
    
    <a id="tiktok-button" href="https://www.tiktok.com/@gabriel_pb07/video/7436941295672675639?lang=pt-BR" target="_blank">
        <button class="button">Assistir Vídeo</button>
    </a>

    <div class="extra-option">
        <button class="button" id="friend-help">PARA VOCÊ NUNCA ESQUECER</button>
        <a id="friend-help-button" href="https://www.tiktok.com/@gabisteca2/video/7373076318033923333?lang=pt-BR" target="_blank">
            <button class="button">Toque aqui</button>
        </a>
    </div>

    <div class="extra-option">
        <button class="button" id="persistence">SE UM DIA ESTIVER MAL E NÃO TIVER NINGUÉM POR PERTO!</button>
        <a id="persistence-button" href="https://www.tiktok.com/@fredelboni/video/7364791632408890629?lang=pt-BR" target="_blank">
            <button class="button">Toque aqui</button>
        </a>
    </div>

    <div class="extra-option">
        <button id="toggle-whatsapp">Caso mude de ideia em relação a nós!</button>
        <a id="whatsapp-button" href="https://api.whatsapp.com/send?phone=87996057697&text=Oii%20saudades%2C%20pensei%20melhor%20kkk" target="_blank">
            <button class="button">Toque aqui</button>
        </a>
    </div>
</div>

<script>
    const btnSim = document.getElementById('sim');
    const btnNao = document.getElementById('nao');
    const message = document.getElementById('message');
    const tiktokButton = document.getElementById('tiktok-button');
    const toggleWhatsapp = document.getElementById('toggle-whatsapp');
    const whatsappButton = document.getElementById('whatsapp-button');
    const friendHelp = document.getElementById('friend-help');
    const friendHelpButton = document.getElementById('friend-help-button');
    const persistence = document.getElementById('persistence');
    const persistenceButton = document.getElementById('persistence-button');

    btnSim.addEventListener('click', () => {
        message.style.display = 'block';
        tiktokButton.style.display = 'block';
    });

    if (window.innerWidth > 600) {
        btnNao.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - btnNao.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNao.offsetHeight);
            btnNao.style.position = 'absolute';
            btnNao.style.left = `${x}px`;
            btnNao.style.top = `${y}px`;
        });
    }

    toggleWhatsapp.addEventListener('click', () => {
        whatsappButton.style.display = 'block';
    });

    friendHelp.addEventListener('click', () => {
        friendHelpButton.style.display = 'block';
    });

    persistence.addEventListener('click', () => {
        persistenceButton.style.display = 'block';
    });
</script>

</body>
</html
